<rect x="0.5" y="0.5" width="1199" height="821" rx="16" class="bg" />
<text x="40" y="52" class="t" font-size="24" font-weight="700" text-anchor="start">架构总览</text>
<text x="40" y="80" class="m" font-size="14" font-weight="400" text-anchor="start">三层：守护层（hooks）把规则机械化 · 会话层（slash commands）一个对话只做一件事 · 状态层（文件）是唯一事实来源</text>
