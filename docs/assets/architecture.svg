<text x="100" y="130" class="m mono" font-size="13" font-weight="400" text-anchor="start">.claude/hooks/ · .claude/settings.json</text>
<rect x="40" y="148" width="360" height="118" rx="10" class="card" stroke-width="1"/>
<rect x="41" y="160" width="4" height="94" rx="2" class="f-blue" />
<text x="62" y="180" class="t" font-size="18" font-weight="700" text-anchor="start">开场门</text>
<text x="126.0" y="180" class="m mono" font-size="13" font-weight="400" text-anchor="start">SessionStart</text>
<rect x="332.0" y="162" width="54.0" height="22" rx="11.0" class="f-gray" />
<text x="359.0" y="177.32" class="w" font-size="12" font-weight="600" text-anchor="middle">只注入</text>
<text x="62" y="206" class="c-blue mono" font-size="13" font-weight="500" text-anchor="start">inject-context.sh → 导航.py</text>
<text x="62" y="230" class="t" font-size="13.5" font-weight="400" text-anchor="start">注入约 5 KB 导航层：周次 · 近期硬截止</text>
<text x="62" y="251" class="t" font-size="13.5" font-weight="400" text-anchor="start">· 各课状态 · 断点 · 当天提醒 · 体检结果</text>
<rect x="420" y="148" width="360" height="118" rx="10" class="card" stroke-width="1"/>
<rect x="421" y="160" width="4" height="94" rx="2" class="f-blue" />
