<text x="442" y="230" class="t" font-size="13.5" font-weight="400" text-anchor="start">每条消息注入：当前时间 · 开讲前必查</text>
<text x="442" y="251" class="t" font-size="13.5" font-weight="400" text-anchor="start">对照表 · 批改先贴题干 · 出题全英文</text>
