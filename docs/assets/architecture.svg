<rect x="1080.0" y="162" width="66.0" height="22" rx="11.0" class="f-red" />
<text x="1113.0" y="177.32" class="w" font-size="12" font-weight="600" text-anchor="middle">能拦回合</text>
<text x="822" y="206" class="c-red mono" font-size="13" font-weight="500" text-anchor="start">stop-check.sh → 检查.py</text>
<text x="822" y="230" class="t" font-size="13.5" font-weight="400" text-anchor="start">有硬伤 → exit 2 拦回，先修再结束回合</text>
<text x="822" y="251" class="t" font-size="13.5" font-weight="400" text-anchor="start">全绿 → 行动项审计 → git 快照</text>
