<text x="506.0" y="180" class="m mono" font-size="13" font-weight="400" text-anchor="start">UserPromptSubmit</text>
<rect x="712.0" y="162" width="54.0" height="22" rx="11.0" class="f-gray" />
<text x="739.0" y="177.32" class="w" font-size="12" font-weight="600" text-anchor="middle">只注入</text>
